name: deploy pages

on:
  workflow_run:
    workflows: ["create release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  download-and-deploy:
    # Only run if triggered manually or if the upstream workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          # Get all release tags
          gh release list --json tagName -q ".[].tagName" > tags.txt
          while read -r TAG; do
            # Extract version from tag (e.g., v0.2.0-release -> v0.2.0)
            DIR_NAME=${TAG%-release}
            echo "Processing release: $TAG into directory: public/$DIR_NAME"
            mkdir -p "public/$DIR_NAME"
            gh release download "$TAG" --dir "public/$DIR_NAME/" --pattern "*" || echo "Failed to download $TAG"
          done < tags.txt
          rm tags.txt
          ls -lR public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
