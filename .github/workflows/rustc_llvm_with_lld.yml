                  echo "ccache = \"sccache\"" >> config.llvm.toml
                  # SHARD THE TARGETS using python
                  python3 -c "import json; t=json.loads(open('config.llvm.toml').read().split('target = ')[1].split('\n')[0]); print('target = ' + json.dumps([x for i,x in enumerate(t) if i % 4 == ${{ matrix.shard }}]))" > shard_tmp.txt
                  NEW_TARGET=$(cat shard_tmp.txt)
                  sed -i.bak "s|^target = \[.*\]|$NEW_TARGET|" config.llvm.toml
                  echo "Sharded targets to: $NEW_TARGET"

    - name: Set up MinGW
