name: rustc_llvm_with_lld

# gh act --job build -s GITHUB_TOKEN="$(gh auth token)" --reuse

# only self-triggered
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Select job to run"
        required: true
        type: choice
        options:
          - install
          - dist-linux
          - dist-macos
          - dist-windows

permissions:
  packages: write
  contents: write

jobs:
  # ============================================================
  # install-abort: Build the default (panic=abort) rustc.wasm
  # Runs in parallel with install-unwind (~3.5h each)
  # ============================================================
  install-abort:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == '' }}
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          rm wasi-sdk-24.0-x86_64-linux.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          chmod -R 755 wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: update
        run: |
          sudo apt-get update
          sudo apt upgrade -y
          sudo apt install -y build-essential cmake pkg-config libclang-dev

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm
          
          # Convert workspace path to forward slashes for TOML compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
          sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml

          echo "=== config.llvm.toml before patching ==="
          grep wasi config.llvm.toml || true
          # Aggressively patch config to use absolute path and standardized folder name
          sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          # Fallback for any other occurrences
          sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          echo "=== config.llvm.toml after patching ==="
          grep wasi config.llvm.toml || true

      # - name: rewrite
      #   run: |
      #     cd rust_wasm/config_rewriter
      #     cargo run -- ../../rust/config.llvm.toml all false
      #     cargo clean
      #     echo "rewrite done"

      - name: build install
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          ./x.py install --config config.llvm.toml

      - name: cache build directory
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-${{ runner.os }}-compile_rustc_for_wasm17

      - name: prepare abort artifacts
        working-directory: '${{ github.workspace }}/rust'
        run: |
          # Archive the full dist/ directory (rustc.wasm, rust-gdb, rust-lldb, libs, etc.)
          tar -cf ${{ github.workspace }}/dist-abort.tar -C dist .
          echo "=== dist-abort artifact ==="
          ls -lh ${{ github.workspace }}/dist-abort.tar

      - name: upload abort artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-abort
          path: ${{ github.workspace }}/dist-abort.tar
          if-no-files-found: error

  # ============================================================
  # install-unwind: Build the unwind (panic=unwind) rustc.wasm
  # Runs in parallel with install-abort (~3.5h each)
  # ============================================================
  install-unwind:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == '' }}
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          rm wasi-sdk-24.0-x86_64-linux.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          chmod -R 755 wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: update
        run: |
          sudo apt-get update
          sudo apt upgrade -y
          sudo apt install -y build-essential cmake pkg-config libclang-dev

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm
          
          # Convert workspace path to forward slashes for TOML compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
          sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml

          echo "=== config.llvm.toml before patching ==="
          grep wasi config.llvm.toml || true
          # Aggressively patch config to use absolute path and standardized folder name
          sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          # Fallback for any other occurrences
          sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          echo "=== config.llvm.toml after patching ==="
          grep wasi config.llvm.toml || true

      - name: create unwind config
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          cp config.llvm.toml config.llvm.unwind.toml

          cat <<'PY' | sed 's/^          //' | python3 -
          from pathlib import Path
          import re

          path = Path("config.llvm.unwind.toml")
          s = path.read_text()

          def set_in_table(src: str, table: str, key: str, value: str) -> str:
              if "." in table:
                  p1, p2 = table.split(".", 1)
                  table_pat = rf"{re.escape(p1)}\.['\"]?{re.escape(p2)}['\"]?"
              else:
                  table_pat = re.escape(table)

              pat = rf"(?ms)^(\[{table_pat}\]\n)(.*?)(?=^\[|\Z)"
              m = re.search(pat, src)
              line = f"{key} = {value}\n"

              if not m:
                  return src.rstrip() + f"\n\n[{table}]\n{line}"

              body = m.group(2)
              key_pat = rf"(?m)^{re.escape(key)}\s*=.*$"

              if re.search(key_pat, body):
                  body = re.sub(key_pat, line.rstrip(), body)
              else:
                  body += line

              return src[:m.start(2)] + body + src[m.end(2):]

          s = set_in_table(s, "rust", "std-features", '["panic_unwind"]')
          
          # Only apply to wasm targets
          wasm_targets = [
              "wasm32-wasip1",
              "wasm32-wasip1-threads",
              "wasm32-unknown-emscripten",
              "wasm32-unknown-unknown"
          ]
          for t in wasm_targets:
              s = set_in_table(
                  s,
                  f"target.{t}",
                  "rustflags",
                  '["-Cpanic=unwind", "-Cllvm-args=-wasm-use-legacy-eh=false"]'
              )

          path.write_text(s)
          PY

          echo "=== unwind config diff ==="
          diff -u config.llvm.toml config.llvm.unwind.toml || true

      - name: build install unwind
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          ./x.py install --config config.llvm.unwind.toml

      - name: prepare unwind artifacts
        working-directory: '${{ github.workspace }}/rust'
        run: |
          # Archive only what we need from the unwind dist (just rustc.wasm)
          tar -cf ${{ github.workspace }}/dist-unwind.tar -C dist .
          echo "=== dist-unwind artifact ==="
          ls -lh ${{ github.workspace }}/dist-unwind.tar

      - name: upload unwind artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-unwind
          path: ${{ github.workspace }}/dist-unwind.tar
          if-no-files-found: error

  # ============================================================
  # merge-bins: Combine abort + unwind artifacts, run wasm-opt,
  # and produce the final rustc-bins artifact.
  # Runs after both install jobs complete (~15min)
  # ============================================================
  merge-bins:
    runs-on: ubuntu-latest
    needs: [install-abort, install-unwind]
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: download abort artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-abort
          path: ${{ github.workspace }}

      - name: download unwind artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-unwind
          path: ${{ github.workspace }}

      - name: extract artifacts
        run: |
          mkdir -p ${{ github.workspace }}/dist-abort
          tar -xf ${{ github.workspace }}/dist-abort.tar -C ${{ github.workspace }}/dist-abort
          mkdir -p ${{ github.workspace }}/dist-unwind
          tar -xf ${{ github.workspace }}/dist-unwind.tar -C ${{ github.workspace }}/dist-unwind
          echo "=== abort dist contents ==="
          ls -lh ${{ github.workspace }}/dist-abort/bin/ || true
          echo "=== unwind dist contents ==="
          ls -lh ${{ github.workspace }}/dist-unwind/bin/ || true

      - name: install wasm-opt
        run: |
          curl -OL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz
          tar -xzf binaryen-version_119-x86_64-linux.tar.gz
          sudo cp binaryen-version_119/bin/wasm-opt /usr/local/bin/wasm-opt
          rm -rf binaryen-version_119-x86_64-linux.tar.gz binaryen-version_119

      - name: prepare bin artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          DIST_ABORT=${{ github.workspace }}/dist-abort
          DIST_UNWIND=${{ github.workspace }}/dist-unwind

          mkdir -p bin-artifacts/dist/bin
          mkdir -p bin-artifacts/dist/lib

          # === abort/default rustc.wasm ===
          mkdir -p dist/bin
          cp $DIST_ABORT/bin/rustc.wasm dist/bin/rustc.wasm
          tar -I "gzip -9" -cvf \
            bin-artifacts/dist/bin/rustc.wasm.tar.gz \
            dist/bin/rustc.wasm
          rm -rf dist

          cp -r config_rewriter /tmp/config_rewriter
          cd /tmp/config_rewriter
          cargo run --bin wasm_optimizer -- $DIST_ABORT/bin/rustc.wasm
          mv opt.wasm ${{ github.workspace }}/rust_wasm/bin-artifacts/rustc_opt.wasm
          
          cd ${{ github.workspace }}/rust_wasm/bin-artifacts
          tar -I "gzip -9" -cvf rustc_opt.wasm.tar.gz rustc_opt.wasm
          rm rustc_opt.wasm

          # === unwind rustc_unwind.wasm ===
          cd /tmp/config_rewriter
          cargo run --bin wasm_optimizer -- $DIST_UNWIND/bin/rustc.wasm
          mv opt.wasm ${{ github.workspace }}/rust_wasm/bin-artifacts/rustc_unwind_opt.wasm

          cd ${{ github.workspace }}/rust_wasm/bin-artifacts
          cp $DIST_UNWIND/bin/rustc.wasm rustc_unwind.wasm
          tar -I "gzip -9" -cvf rustc_unwind.wasm.tar.gz rustc_unwind.wasm
          tar -I "gzip -9" -cvf rustc_unwind_opt.wasm.tar.gz rustc_unwind_opt.wasm
          rm rustc_unwind.wasm rustc_unwind_opt.wasm

          # copy other tools/libs from abort/default dist
          cp $DIST_ABORT/bin/rust-gdb bin-artifacts/dist/bin/
          cp $DIST_ABORT/bin/rust-gdbgui bin-artifacts/dist/bin/
          cp $DIST_ABORT/bin/rust-lldb bin-artifacts/dist/bin/
          cp -r $DIST_ABORT/lib/* bin-artifacts/dist/lib/

          # Archive into a single file
          cd ${{ github.workspace }}/rust_wasm
          tar --force-local -cf ${{ github.workspace }}/rust_wasm/rustc-bins.tar -C bin-artifacts .
          echo "=== Artifact status ==="
          ls -lh ${{ github.workspace }}/rust_wasm/rustc-bins.tar
          rm -rf bin-artifacts

      - name: upload bin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustc-bins
          path: ${{ github.workspace }}/rust_wasm/rustc-bins.tar
          if-no-files-found: error

  dist-linux:
    # strategy:
    #   matrix:
    #     WebAssembly: [true, false]

    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'dist-linux' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'main'


      - name: rustbuild setup
        run: |
          sudo groupadd -r rustbuild && sudo useradd -m -r -g rustbuild rustbuild
          sudo mkdir -p /x-tools && sudo chown rustbuild:rustbuild /x-tools
          sudo chmod 777 /x-tools
          sudo mkdir -p /tmp && sudo chown rustbuild:rustbuild /tmp
          sudo chmod 777 /tmp
          sudo chmod 777 /usr/local/lib/
          sudo chmod 777 /usr/local/bin/
          sudo chmod 777 /usr/local/
          sudo chmod 777 /usr/bin/
          sudo chmod 777 /
          sudo chmod 777 /lib
          sudo chmod 777 /etc
          echo '/usr/local/bin/' >> $GITHUB_PATH

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          rm wasi-sdk-24.0-x86_64-linux.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          chmod -R 755 wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: update
        run: |
          sudo apt-get update
          sudo apt upgrade -y
          sudo apt install -y build-essential cmake pkg-config libclang-dev
          # install mingw for windows
          sudo apt install -y mingw-w64

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
          local-cache: false

      - name: install ndk path
        run: |
          ls -l ${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir -p ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/riscv64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/riscv64-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/llvm-ar'

          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/llvm-ar'

          echo '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins' >> $GITHUB_PATH

          echo 'ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}' >> $GITHUB_ENV

      - name: check clang
        run: |
          clang --version
          x86_64-linux-android-clang --version

      # - name: install musl dependencies x86_64
      #   run: |
      #     FLAG_FILE="/tmp/musl-x86_64-installed"
      #     if [ ! -f "$FLAG_FILE" ]; then
      #       mkdir ~/build
      #       cd ~/build
      #       curl -OL https://oligamiq.github.io/cdn/musl-bin/x86_64-linux-musl-cross.tgz_aa
      #       curl -OL https://oligamiq.github.io/cdn/musl-bin/x86_64-linux-musl-cross.tgz_ab
      #       cat x86_64-linux-musl-cross.tgz_* | tar -xzv
      #       rm x86_64-linux-musl-cross.tgz_*
      #       rm -rf /musl-x86_64
      #       mkdir -p /musl-x86_64
      #       sudo mv x86_64-linux-musl-cross/* /musl-x86_64
      #       cd /
      #       rm -rf ~/build/
      #       sudo ln -sf /musl-x86_64/bin/x86_64-linux-musl-gcc /usr/local/bin/musl-gcc
      #       sudo ln -sf /musl-x86_64/bin/x86_64-linux-musl-g++ /usr/local/bin/musl-g++
      #       touch "$FLAG_FILE"
      #     else
      #       echo "musl x86_64 is already installed, skipping installation."
      #     fi

      # https://github.com/rust-lang/rust/blob/65b3877488ccfef3b1a903bfdd269559c59b957c/src/doc/rustc/src/platform-support/wasm32-unknown-emscripten.md
      - name: install emscripten
        run: |
          FLAG_FILE="/tmp/emscripten-installed"
          rm -f "$FLAG_FILE"
          if [ ! -f "$FLAG_FILE" ]; then
            rm -rf /emsdk
            sudo mkdir -p /emsdk
            sudo chmod 777 /emsdk
            cd /emsdk
            git clone https://github.com/emscripten-core/emsdk.git --depth 1
            ./emsdk/emsdk install 3.1.68
            ./emsdk/emsdk activate 3.1.68
            source ./emsdk/emsdk_env.sh
            echo '/emsdk/emsdk' >> $GITHUB_PATH
            echo '/emsdk/emsdk/upstream/emscripten' >> $GITHUB_PATH
            touch "$FLAG_FILE"
          else
            echo "emscripten is already installed, skipping installation."
          fi

      # - name: rewrite
      #   run: |
      #     cd rust_wasm/config_rewriter
      #     cargo run -- ../../rust/config.llvm.toml all linux
      #     cargo clean
      #     echo "rewrite done"

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-${{ runner.os }}-compile_rustc_for_wasm17

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          toolchain-for-building-rustc --tier 1 --tier 2-host --os linux -t sparcv9-sun-solaris --install --no-cache -f config.llvm.toml -t arm-unknown-linux-musleabi -t arm-unknown-linux-musleabihf -t i586-unknown-linux-gnu -t i686-unknown-linux-musl -t wasm32-wasip1 -t wasm32-wasip1-threads -t wasm32-wasip2 -t x86_64-pc-windows-gnu -t wasm32-unknown-unknown -t wasm32-unknown-emscripten
          toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm
          
          # Convert workspace path to forward slashes for TOML compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
          sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml

          echo "=== config.llvm.toml before patching ==="
          grep wasi config.llvm.toml || true
          # Aggressively patch config to use absolute path and standardized folder name
          sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          # Fallback for any other occurrences
          sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          echo "=== config.llvm.toml after patching ==="
          grep wasi config.llvm.toml || true

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          export RUST_CONFIGURE_ARGS='${{ env.RUST_CONFIGURE_ARGS }}'
          # ./x.py install --config config.llvm.toml
          ./x.py build library --config config.llvm.toml --stage 1

          # copy files
          mkdir -p dist/lib/rustlib
          rsync -av --exclude="rustc-src" build/x86_64-unknown-linux-gnu/stage1/lib/rustlib/ dist/lib/rustlib/
          rm -rf dist/lib/rustlib/x86_64-unknown-linux-gnu/bin

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          mkdir -p dist-artifacts
          mv ../rust/dist dist-artifacts/dist
          rm -rf dist-artifacts/dist/bin
          # Archive into a single file to avoid API limits (800k+ files is too many)
          tar -cf ${{ github.workspace }}/rust_wasm/dist-linux.tar -C dist-artifacts .
          echo "=== Artifact status ==="
          ls -lh ${{ github.workspace }}/rust_wasm/dist-linux.tar
          du -sh dist-artifacts
          rm -rf dist-artifacts

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: ${{ github.workspace }}/rust_wasm/dist-linux.tar
          if-no-files-found: error

  dist-macos:
    runs-on: macos-latest
    if: ${{ github.event.inputs.job == 'dist-macos' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'
          fetch-depth: 0

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: set SDKROOT
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-arm64-macos.tar.gz
          tar -xzf wasi-sdk-24.0-arm64-macos.tar.gz
          rm wasi-sdk-24.0-arm64-macos.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          chmod -R 755 wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          toolchain-for-building-rustc --tier 1 --tier 2-host --os mac --install --no-cache -f config.llvm.toml --overwrite -t wasm32-wasip1 -t wasm32-wasip1-threads
          toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm
          
          # Convert workspace path to forward slashes for TOML compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
          sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml

          echo "=== config.llvm.toml before patching ==="
          grep wasi config.llvm.toml || true
          # Aggressively patch config to use absolute path and standardized folder name
          sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          # Fallback for any other occurrences
          sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          echo "=== config.llvm.toml after patching ==="
          grep wasi config.llvm.toml || true

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-Linux-compile_rustc_for_wasm17

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          ./x.py build library --config config.llvm.toml --stage 1
          mkdir -p dist/lib/rustlib
          rsync -av --exclude="rustc-src" build/aarch64-apple-darwin/stage1/lib/rustlib/ dist/lib/rustlib/
          rm -rf dist/lib/rustlib/aarch64-apple-darwin/bin

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          mkdir -p dist-artifacts
          mv ../rust/dist dist-artifacts/dist
          rm -rf dist-artifacts/dist/bin
          # Archive into a single file
          tar -cf ${{ github.workspace }}/rust_wasm/dist-macos.tar -C dist-artifacts .
          echo "=== Artifact status ==="
          ls -lh ${{ github.workspace }}/rust_wasm/dist-macos.tar
          du -sh dist-artifacts
          rm -rf dist-artifacts

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: ${{ github.workspace }}/rust_wasm/dist-macos.tar
          if-no-files-found: error

  dist-windows:
    runs-on: windows-latest
    if: ${{ github.event.inputs.job == 'dist-windows' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'
          fetch-depth: 0

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-windows.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-windows.tar.gz
          rm wasi-sdk-24.0-x86_64-windows.tar.gz
          mv wasi-sdk-24.0-* wasi-sdk
          echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
          echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV


      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          toolchain-for-building-rustc --tier 1 --tier 2-host --os windows --install --no-cache -f config.llvm.toml --overwrite -t wasm32-wasip1 -t wasm32-wasip1-threads --exclude x86_64-pc-windows-gnu
          toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm
          
          # Convert workspace path to forward slashes for TOML compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
          sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml

          echo "=== config.llvm.toml before patching ==="
          grep wasi config.llvm.toml || true
          # Aggressively patch config to use absolute path and standardized folder name
          sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          # Fallback for any other occurrences
          sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
          mv config.llvm.toml.tmp config.llvm.toml
          echo "=== config.llvm.toml after patching ==="
          grep wasi config.llvm.toml || true

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2.2.0
        with:
          version: 12.2.0
          platform: any

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-Linux-compile_rustc_for_wasm17

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        shell: bash
        env:
          WASI_SDK_PATH: ${{ github.workspace }}/rust/wasi-sdk
          WASI_SYSROOT: ${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          python ./x.py build library --config config.llvm.toml --stage 1
          
          rm -rf dist
          mkdir -p dist/lib/rustlib
          
          source_dir="build/x86_64-pc-windows-msvc/stage1/lib/rustlib"
          if [ -d "$source_dir" ]; then
              # Copy everything EXCEPT rustc-src safely using bash
              find "$source_dir" -mindepth 1 -maxdepth 1 ! -name "rustc-src" -exec cp -R {} dist/lib/rustlib/ \;
          else
              echo "Source path $source_dir does not exist!"
              exit 1
          fi
          
          # Cleanup target-specific bin (consistent with Linux/Mac)
          rm -rf dist/lib/rustlib/x86_64-pc-windows-msvc/bin

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        shell: bash
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          # Convert workspace path to forward slashes for compatibility
          WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')
          
          mkdir -p dist-artifacts
          mv ../rust/dist dist-artifacts/dist
          rm -rf dist-artifacts/dist/bin
          # Archive into a single file (tar is available in Git Bash on Windows)
          # Use --force-local to avoid interpreting the drive colon as a remote host
          tar --force-local -cf "${WS_FORWARD}/rust_wasm/dist-windows.tar" -C dist-artifacts .
          echo "=== Artifact status ==="
          ls -lh "${WS_FORWARD}/rust_wasm/dist-windows.tar"
          rm -rf dist-artifacts

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: ${{ github.workspace }}/rust_wasm/dist-windows.tar
          if-no-files-found: error
