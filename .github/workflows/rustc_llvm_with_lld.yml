name: rustc_llvm_with_lld

# gh act --job build -s GITHUB_TOKEN="$(gh auth token)" --reuse

# only self-triggered
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Select job to run"
        required: true
        type: choice
        options:
          - install
          - dist-linux
          - dist-macos
          - dist-windows

permissions:
  packages: write
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == '' }}
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          mv wasi-sdk-24.0-x86_64-linux wasi-sdk
          chmod -R 755 wasi-sdk

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: update
        run: |
          sudo apt-get update
          sudo apt upgrade -y
          sudo apt install -y build-essential cmake pkg-config libclang-dev

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm

      # - name: rewrite
      #   run: |
      #     cd rust_wasm/config_rewriter
      #     cargo run -- ../../rust/config.llvm.toml all false
      #     cargo clean
      #     echo "rewrite done"

      - name: build install
        working-directory: '${{ github.workspace }}/rust'
        env:
          WASI_SDK_PATH: ${{ github.workspace }}/rust/wasi-sdk
          WASI_SYSROOT: ${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          ./x.py install --config config.llvm.toml

      - name: cache build directory
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-${{ runner.os }}-compile_rustc_for_wasm17

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: install wasm-opt
        run: |
          curl -OL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz
          tar -xzf binaryen-version_119-x86_64-linux.tar.gz
          sudo cp binaryen-version_119/bin/wasm-opt /usr/local/bin/wasm-opt
          rm -rf binaryen-version_119-x86_64-linux.tar.gz binaryen-version_119

      - name: prepare bin artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        env:
          GZIP: -9
        run: |
          mkdir -p bin-artifacts/dist/bin
          mkdir -p bin-artifacts/dist/lib

          # prepare files from rust build
          cd ${{ github.workspace }}/rust
          tar -cvzf bin-artifacts/dist/bin/rustc.wasm.tar.gz dist/bin/rustc.wasm
          
          # optimize wasm
          cp -r ${{ github.workspace }}/rust_wasm/config_rewriter /tmp/config_rewriter
          cd /tmp/config_rewriter
          cargo run --bin wasm_optimizer -- ${{ github.workspace }}/rust/dist/bin/rustc.wasm
          mv opt.wasm ${{ github.workspace }}/rust_wasm/bin-artifacts/rustc_opt.wasm
          
          cd ${{ github.workspace }}/rust_wasm/bin-artifacts
          tar -cvzf rustc_opt.wasm.tar.gz rustc_opt.wasm
          rm rustc_opt.wasm

          # copy other tools
          cd ${{ github.workspace }}/rust
          cp dist/bin/rust-gdb ${{ github.workspace }}/rust_wasm/bin-artifacts/dist/bin/
          cp dist/bin/rust-gdbgui ${{ github.workspace }}/rust_wasm/bin-artifacts/dist/bin/
          cp dist/bin/rust-lldb ${{ github.workspace }}/rust_wasm/bin-artifacts/dist/bin/
          cp -r dist/lib/* ${{ github.workspace }}/rust_wasm/bin-artifacts/dist/lib/

      - name: upload bin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustc-bins
          path: rust_wasm/bin-artifacts/

  dist-linux:
    # strategy:
    #   matrix:
    #     WebAssembly: [true, false]

    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.job == 'dist-linux' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'main'


      - name: rustbuild setup
        run: |
          sudo groupadd -r rustbuild && sudo useradd -m -r -g rustbuild rustbuild
          sudo mkdir -p /x-tools && sudo chown rustbuild:rustbuild /x-tools
          sudo chmod 777 /x-tools
          sudo mkdir -p /tmp && sudo chown rustbuild:rustbuild /tmp
          sudo chmod 777 /tmp
          sudo chmod 777 /usr/local/lib/
          sudo chmod 777 /usr/local/bin/
          sudo chmod 777 /usr/local/
          sudo chmod 777 /usr/bin/
          sudo chmod 777 /
          sudo chmod 777 /lib
          sudo chmod 777 /etc
          echo '/usr/local/bin/' >> $GITHUB_PATH

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-linux.tar.gz
          mv wasi-sdk-24.0-x86_64-linux wasi-sdk
          chmod -R 755 wasi-sdk

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: update
        run: |
          sudo apt-get update
          sudo apt upgrade -y
          sudo apt install -y build-essential cmake pkg-config libclang-dev
          # install mingw for windows
          sudo apt install -y mingw-w64

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install ndk
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
          local-cache: false

      - name: install ndk path
        run: |
          ls -l ${{ steps.setup-ndk.outputs.ndk-path }}
          mkdir -p ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/riscv64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/riscv64-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang++'
          sudo ln -sf '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar' '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/llvm-ar'

          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/aarch64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/i686-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/arm-linux-androideabi-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/riscv64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/x86_64-linux-android-clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/clang++'
          sudo chmod +x '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins/llvm-ar'

          echo '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bins' >> $GITHUB_PATH

          echo 'ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}' >> $GITHUB_ENV

      - name: check clang
        run: |
          clang --version
          x86_64-linux-android-clang --version

      # - name: install musl dependencies x86_64
      #   run: |
      #     FLAG_FILE="/tmp/musl-x86_64-installed"
      #     if [ ! -f "$FLAG_FILE" ]; then
      #       mkdir ~/build
      #       cd ~/build
      #       curl -OL https://oligamiq.github.io/cdn/musl-bin/x86_64-linux-musl-cross.tgz_aa
      #       curl -OL https://oligamiq.github.io/cdn/musl-bin/x86_64-linux-musl-cross.tgz_ab
      #       cat x86_64-linux-musl-cross.tgz_* | tar -xzv
      #       rm x86_64-linux-musl-cross.tgz_*
      #       rm -rf /musl-x86_64
      #       mkdir -p /musl-x86_64
      #       sudo mv x86_64-linux-musl-cross/* /musl-x86_64
      #       cd /
      #       rm -rf ~/build/
      #       sudo ln -sf /musl-x86_64/bin/x86_64-linux-musl-gcc /usr/local/bin/musl-gcc
      #       sudo ln -sf /musl-x86_64/bin/x86_64-linux-musl-g++ /usr/local/bin/musl-g++
      #       touch "$FLAG_FILE"
      #     else
      #       echo "musl x86_64 is already installed, skipping installation."
      #     fi

      # https://github.com/rust-lang/rust/blob/65b3877488ccfef3b1a903bfdd269559c59b957c/src/doc/rustc/src/platform-support/wasm32-unknown-emscripten.md
      - name: install emscripten
        run: |
          FLAG_FILE="/tmp/emscripten-installed"
          rm -f "$FLAG_FILE"
          if [ ! -f "$FLAG_FILE" ]; then
            rm -rf /emsdk
            sudo mkdir -p /emsdk
            sudo chmod 777 /emsdk
            cd /emsdk
            git clone https://github.com/emscripten-core/emsdk.git --depth 1
            ./emsdk/emsdk install 3.1.68
            ./emsdk/emsdk activate 3.1.68
            source ./emsdk/emsdk_env.sh
            echo '/emsdk/emsdk' >> $GITHUB_PATH
            echo '/emsdk/emsdk/upstream/emscripten' >> $GITHUB_PATH
            touch "$FLAG_FILE"
          else
            echo "emscripten is already installed, skipping installation."
          fi

      # - name: rewrite
      #   run: |
      #     cd rust_wasm/config_rewriter
      #     cargo run -- ../../rust/config.llvm.toml all linux
      #     cargo clean
      #     echo "rewrite done"

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-${{ runner.os }}-compile_rustc_for_wasm17

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier 1 --tier 2-host --os linux -t sparcv9-sun-solaris --install --no-cache -f config.llvm.toml -t arm-unknown-linux-musleabi -t arm-unknown-linux-musleabihf -t i586-unknown-linux-gnu -t i686-unknown-linux-musl -t wasm32-wasip1 -t wasm32-wasip1-threads -t wasm32-wasip2 -t x86_64-pc-windows-gnu -t wasm32-unknown-unknown -t wasm32-unknown-emscripten
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        env:
          WASI_SDK_PATH: ${{ github.workspace }}/rust/wasi-sdk
          WASI_SYSROOT: ${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          export RUST_CONFIGURE_ARGS='${{ env.RUST_CONFIGURE_ARGS }}'
          # ./x.py install --config config.llvm.toml
          ./x.py build library --config config.llvm.toml --stage 1

          # copy files
          mkdir -p dist/lib/rustlib
          rsync -av build/x86_64-unknown-linux-gnu/stage1/lib/rustlib/ dist/lib/rustlib/
          rm -rf dist/lib/rustlib/x86_64-unknown-linux-gnu/bin

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          mkdir -p dist-artifacts
          mv ../rust/dist dist-artifacts/dist
          rm -rf dist-artifacts/dist/bin

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: rust_wasm/dist-artifacts/

  dist-macos:
    runs-on: macos-latest
    if: ${{ github.event.inputs.job == 'dist-macos' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'
          fetch-depth: 0

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: set SDKROOT
        run: |
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-arm64-macos.tar.gz
          tar -xzf wasi-sdk-24.0-arm64-macos.tar.gz
          mv wasi-sdk-24.0-arm64-macos wasi-sdk
          chmod -R 755 wasi-sdk

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier 1 --tier 2-host --os mac --install --no-cache -f config.llvm.toml --overwrite -t wasm32-wasip1 -t wasm32-wasip1-threads
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-Linux-compile_rustc_for_wasm17

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        env:
          WASI_SDK_PATH: ${{ github.workspace }}/rust/wasi-sdk
          WASI_SYSROOT: ${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          ./x.py build library --config config.llvm.toml --stage 1
          mkdir -p dist/lib/rustlib
          rsync -av build/aarch64-apple-darwin/stage1/lib/rustlib/ dist/lib/rustlib/
          rm -rf dist/lib/rustlib/aarch64-apple-darwin/bin

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          mkdir -p dist-artifacts
          mv ../rust/dist dist-artifacts/dist
          rm -rf dist-artifacts/dist/bin

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: rust_wasm/dist-artifacts/

  dist-windows:
    runs-on: windows-latest
    if: ${{ github.event.inputs.job == 'dist-windows' || github.event.inputs.job == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
      - name: copy source
        uses: actions/checkout@v4
        with:
          # repository: 'bjorn3/rust'
          repository: 'oligamiq/rust' # patch
          submodules: 'true'
          ref: 'compile_rustc_for_wasm17'
          path: 'rust'

      - name: checkout
        run: |
          cd rust
          git fetch origin compile_rustc_for_wasm16_cargo --depth 40
          git checkout cf327c2068549194a29160499c2ecafa9061e46e

      - uses: actions/checkout@v4
        with:
          path: 'rust_wasm'
          ref: 'gh-actions'
          fetch-depth: 0

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: install-wasi-sdk
        working-directory: '${{ github.workspace }}/rust'
        run: |
          curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-windows.tar.gz
          tar -xzf wasi-sdk-24.0-x86_64-windows.tar.gz
          mv wasi-sdk-24.0-x86_64-windows wasi-sdk

      - name: install toolchain-for-building-rustc
        working-directory: '${{ github.workspace }}/rust'
        env:
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier 1 --tier 2-host --os windows --install --no-cache -f config.llvm.toml --overwrite -t wasm32-wasip1 -t wasm32-wasip1-threads --exclude x86_64-pc-windows-gnu
          WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2.2.0
        with:
          version: 12.2.0
          platform: any

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/rust/build
          key: build-dir-Linux-compile_rustc_for_wasm17

      - name: build dist
        working-directory: '${{ github.workspace }}/rust'
        shell: pwsh
        env:
          WASI_SDK_PATH: ${{ github.workspace }}/rust/wasi-sdk
          WASI_SYSROOT: ${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot
          RUST_CONFIGURE_ARGS: "-W warnings"
          RUSTFLAGS: "-W warnings"
        run: |
          python ./x.py build library --config config.llvm.toml --stage 1
          if (Test-Path -Path "dist") {
            Remove-Item -Recurse -Force -Path dist
          }
          New-Item -ItemType Directory -Path "dist\lib\rustlib" -Force | Out-Null
          
          $source = "build\x86_64-pc-windows-msvc\stage1\lib\rustlib"
          Copy-Item -Path "$source\*" -Destination "dist\lib\rustlib" -Recurse -Force
          
          # Cleanup target-specific bin (consistent with Linux/Mac)
          if (Test-Path -Path "dist\lib\rustlib\x86_64-pc-windows-msvc\bin") {
              Remove-Item -Recurse -Force -Path "dist\lib\rustlib\x86_64-pc-windows-msvc\bin"
          }

      - name: Configure git to trust the workspace despite the different owner
        run:
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: prepare dist artifacts
        shell: pwsh
        working-directory: '${{ github.workspace }}/rust_wasm'
        run: |
          if (Test-Path -Path "dist-artifacts") {
              Remove-Item -Recurse -Force -Path "dist-artifacts"
          }
          New-Item -ItemType Directory -Path "dist-artifacts" -Force | Out-Null
          
          if (Test-Path -Path "..\rust\dist") {
              Move-Item -Path "..\rust\dist" -Destination "dist-artifacts\dist"
          }

          if (Test-Path -Path "dist-artifacts\dist\bin") {
              Remove-Item -Recurse -Force -Path "dist-artifacts\dist\bin"
          }

      - name: upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: rust_wasm/dist-artifacts/
