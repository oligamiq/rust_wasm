  dist-macos:
    runs-on: macos-latest
    if: ${{ github.event.inputs.job == 'dist-macos' || github.event.inputs.job 
      == '' }}
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    steps:
    - name: copy source
      uses: actions/checkout@v4
      with:
          # repository: 'bjorn3/rust'
        repository: 'oligamiq/rust'   # patch
        submodules: 'true'
        ref: 'cf327c2068549194a29160499c2ecafa9061e46e'
        path: 'rust'

        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        path: 'rust_wasm'
        ref: 'gh-actions'
        fetch-depth: 0

    - name: setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7
    - name: free space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true

        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: install rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: set SDKROOT
      run: |
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

    - name: install-wasi-sdk
      working-directory: '${{ github.workspace }}/rust'
      shell: bash
      run: |
        curl -OL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-arm64-macos.tar.gz
        tar -xzf wasi-sdk-24.0-arm64-macos.tar.gz
        rm wasi-sdk-24.0-arm64-macos.tar.gz
        mv wasi-sdk-24.0-* wasi-sdk
        chmod -R 755 wasi-sdk
        echo "WASI_SDK_PATH=${{ github.workspace }}/rust/wasi-sdk" >> $GITHUB_ENV
        echo "WASI_SYSROOT=${{ github.workspace }}/rust/wasi-sdk/share/wasi-sysroot" >> $GITHUB_ENV

    - name: install toolchain-for-building-rustc
      working-directory: '${{ github.workspace }}/rust'
      shell: bash
      env:
        RUST_CONFIGURE_ARGS: "-W warnings"
        RUSTFLAGS: "-W warnings"
      run: |
        cargo install --git https://github.com/oligamiq/toolchain-for-building-rustc
        toolchain-for-building-rustc --tier 1 --tier 2-host --os mac --install --no-cache -f config.llvm.toml --overwrite -t wasm32-wasip1 -t wasm32-wasip1-threads
        toolchain-for-building-rustc --tier all --os linux --os windows --os mac -f config.llvm.toml --only-llvm

        # Convert workspace path to forward slashes for TOML compatibility
        WS_FORWARD=$(echo "${{ github.workspace }}" | tr '\\' '/')

        # Global fix: replace ALL backslashes with forward slashes in the config file to avoid TOML escape character errors
        sed 's|\\|/|g' config.llvm.toml > config.llvm.toml.tmp
        mv config.llvm.toml.tmp config.llvm.toml

        echo "=== config.llvm.toml before patching ==="
        grep wasi config.llvm.toml || true
        # Aggressively patch config to use absolute path and standardized folder name
        sed "s|wasi-root = .*|wasi-root = \"${WS_FORWARD}/rust/wasi-sdk/share/wasi-sysroot\"|g" config.llvm.toml > config.llvm.toml.tmp
        mv config.llvm.toml.tmp config.llvm.toml
        # Fallback for any other occurrences
        sed "s|wasi-sdk-24\.0-[^/\"]*|${WS_FORWARD}/rust/wasi-sdk|g" config.llvm.toml > config.llvm.toml.tmp
        mv config.llvm.toml.tmp config.llvm.toml
        echo "=== config.llvm.toml after patching ==="
        grep wasi config.llvm.toml || true
                  echo "" >> config.llvm.toml
                  echo "[rust]" >> config.llvm.toml
                  echo "ccache = \"sccache\"" >> config.llvm.toml
                  # SHARD THE TARGETS using jq
                  TARGETS_JSON=$(grep '^target = \[' config.llvm.toml | sed 's/target = //')
                  SHARDED_JSON=$(echo "$TARGETS_JSON" | jq -c "to_entries | map(select(.key % 4 == ${{ matrix.shard }}) | .value)")
                  sed -i.bak "s|^target = \[.*\]|target = $SHARDED_JSON|" config.llvm.toml
                  echo "Sharded targets to: $SHARDED_JSON"

    - name: build dist
      working-directory: '${{ github.workspace }}/rust'
      env:
        RUST_CONFIGURE_ARGS: "-W warnings"
        RUSTFLAGS: "-W warnings"
        SCCACHE_GHA_ENABLED: 'true'
        RUSTC_WRAPPER: sccache
      run: |
        ./x.py build library --config config.llvm.toml --stage 1
        mkdir -p dist/lib/rustlib
        rsync -av --exclude="rustc-src" build/aarch64-apple-darwin/stage1/lib/rustlib/ dist/lib/rustlib/
        rm -rf dist/lib/rustlib/aarch64-apple-darwin/bin
                  sccache --show-stats

    - name: Configure git to trust the workspace despite the different owner
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: prepare dist artifacts
      working-directory: '${{ github.workspace }}/rust_wasm'
      run: |
        mkdir -p dist-artifacts
        mv ../rust/dist dist-artifacts/dist
        rm -rf dist-artifacts/dist/bin
        # Archive into a single file
        tar -chf ${{ github.workspace }}/rust_wasm/dist-macos-${{ matrix.shard }}.tar -C dist-artifacts .
        echo "=== Artifact status ==="
        ls -lh ${{ github.workspace }}/rust_wasm/dist-macos-${{ matrix.shard }}.tar
        du -sh dist-artifacts
        rm -rf dist-artifacts

    - name: upload dist artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-macos-${{ matrix.shard }}
        path: ${{ github.workspace }}/rust_wasm/dist-macos-${{ matrix.shard 
          }}.tar
        if-no-files-found: error

    strategy:
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
