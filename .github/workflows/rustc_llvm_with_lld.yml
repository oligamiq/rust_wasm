  merge-abort:
    runs-on: ubuntu-latest
    needs:
    - install-abort
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == 
      '' }}
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        path: 'rust_wasm'
        ref: 'gh-actions'

        fetch-depth: 0
    - &id002
      name: setup sccache
      uses: mozilla-actions/sccache-action@v0.0.7
    - &id003
      name: install rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: download abort artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-abort
        path: ${{ github.workspace }}

    - &id004
      name: extract artifacts
      run: |2

                  mkdir -p ${{ github.workspace }}/dist-unwind
                  tar -xf ${{ github.workspace }}/dist-unwind.tar -C ${{ github.workspace }}/dist-unwind
                  echo "=== unwind dist contents ==="
                  ls -lh ${{ github.workspace }}/dist-unwind/bin/ || true

    - &id005
      name: install wasm-opt
      run: |
        curl -OL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz
        tar -xzf binaryen-version_119-x86_64-linux.tar.gz
        sudo cp binaryen-version_119/bin/wasm-opt /usr/local/bin/wasm-opt
        rm -rf binaryen-version_119-x86_64-linux.tar.gz binaryen-version_119

    - &id006
      name: prepare bin artifacts
      working-directory: '${{ github.workspace }}/rust_wasm'
      run: |2

                  DIST_UNWIND=${{ github.workspace }}/dist-unwind

                  mkdir -p bin-artifacts/dist/bin
                  mkdir -p bin-artifacts/dist/lib

                  # === unwind rustc_unwind.wasm ===
                  cp -r config_rewriter /tmp/config_rewriter
                  cd /tmp/config_rewriter
                  cargo run --bin wasm_optimizer -- $DIST_UNWIND/bin/rustc.wasm
                  mv opt.wasm ${{ github.workspace }}/rust_wasm/bin-artifacts/rustc_unwind_opt.wasm

                  cd ${{ github.workspace }}/rust_wasm/bin-artifacts
                  cp $DIST_UNWIND/bin/rustc.wasm rustc_unwind.wasm
                  tar -h -I "gzip -9" -cvf rustc_unwind.wasm.tar.gz rustc_unwind.wasm
                  tar -h -I "gzip -9" -cvf rustc_unwind_opt.wasm.tar.gz rustc_unwind_opt.wasm
                  rm rustc_unwind.wasm rustc_unwind_opt.wasm

                  cd ${{ github.workspace }}/rust_wasm

                  # Archive into a single file
                  cd ${{ github.workspace }}/rust_wasm
                  tar --force-local -chf ${{ github.workspace }}/rust_wasm/rustc-bins-unwind.tar -C bin-artifacts .
                  echo "=== Artifact status ==="
                  ls -lh ${{ github.workspace }}/rust_wasm/rustc-bins-unwind.tar
                  rm -rf bin-artifacts

    - &id007
      name: upload bin artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rustc-bins-unwind
        path: ${{ github.workspace }}/rust_wasm/rustc-bins-unwind.tar
        if-no-files-found: error

  merge-unwind:
    runs-on: ubuntu-latest
    needs:
    - install-unwind
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == 
      '' }}
    steps:
    - *id001
    - *id002
    - *id003
    - name: download unwind artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-unwind
        path: ${{ github.workspace }}

    - *id004
    - *id005
    - *id006
    - *id007
  merge-bins-final:
    runs-on: ubuntu-latest
    needs:
    - merge-abort
    - merge-unwind
    if: ${{ github.event.inputs.job == 'install' || github.event.inputs.job == 
      '' }}
    steps:
    - name: download abort artifacts
      uses: actions/download-artifact@v4
      with:
        name: rustc-bins-abort
        path: ${{ github.workspace }}
    - name: download unwind artifacts
      uses: actions/download-artifact@v4
      with:
        name: rustc-bins-unwind
        path: ${{ github.workspace }}
    - name: merge and upload
      run: "\n          mkdir -p bin-artifacts\n          tar -xf ${{ github.workspace
        }}/rustc-bins-abort.tar -C bin-artifacts\n          tar -xf ${{ github.workspace
        }}/rustc-bins-unwind.tar -C bin-artifacts\n          \n          echo \"===
        Verifying contents ===\"\n          ls -lh bin-artifacts/\n          \n  \
        \        cd bin-artifacts\n          tar --force-local -chf ${{ github.workspace
        }}/rustc-bins.tar .\n"
    - name: upload final bin artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rustc-bins
        path: ${{ github.workspace }}/rustc-bins.tar
        if-no-files-found: error
