name: create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version of the toolchain to build'
        required: true
        default: 'v0.2.1'
      build_run_id:
        description: 'successful rustc_llvm_with_lld run containing the complete artifact set'
        required: true

permissions:
  actions: read
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: linux-target-0
            kind: target
            platform: linux
            artifact: release-linux
            shard: 0
            shard_count: 6
          - task: linux-target-1
            kind: target
            platform: linux
            artifact: release-linux
            shard: 1
            shard_count: 6
          - task: linux-target-2
            kind: target
            platform: linux
            artifact: release-linux
            shard: 2
            shard_count: 6
          - task: linux-target-3
            kind: target
            platform: linux
            artifact: release-linux
            shard: 3
            shard_count: 6
          - task: linux-target-4
            kind: target
            platform: linux
            artifact: release-linux
            shard: 4
            shard_count: 6
          - task: linux-target-5
            kind: target
            platform: linux
            artifact: release-linux
            shard: 5
            shard_count: 6
          - task: windows-target-0
            kind: target
            platform: windows
            artifact: release-windows
            shard: 0
            shard_count: 4
          - task: windows-target-1
            kind: target
            platform: windows
            artifact: release-windows
            shard: 1
            shard_count: 4
          - task: windows-target-2
            kind: target
            platform: windows
            artifact: release-windows
            shard: 2
            shard_count: 4
          - task: windows-target-3
            kind: target
            platform: windows
            artifact: release-windows
            shard: 3
            shard_count: 4
          - task: macos-target-0
            kind: target
            platform: macos
            artifact: release-macos
            shard: 0
            shard_count: 4
          - task: macos-target-1
            kind: target
            platform: macos
            artifact: release-macos
            shard: 1
            shard_count: 4
          - task: macos-target-2
            kind: target
            platform: macos
            artifact: release-macos
            shard: 2
            shard_count: 4
          - task: macos-target-3
            kind: target
            platform: macos
            artifact: release-macos
            shard: 3
            shard_count: 4
          - task: linux-source
            kind: source
            platform: linux
            artifact: release-linux
          - task: rustc-bins
            kind: rustc
            artifact: rustc-bins
          - task: llvm-bins
            kind: llvm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rust_wasm

      - name: install brotli
        run: |
          sudo apt-get update
          sudo apt-get install brotli
          echo "brotli installed time: $(date)"

      - name: download Rust artifact
        if: ${{ matrix.kind != 'llvm' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.build_run_id }}

      - name: download LLVM artifacts
        if: ${{ matrix.kind == 'llvm' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          RUN_ID_LLVM=$(gh run list --workflow build_llvm.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$RUN_ID_LLVM" != "null" ] && [ -n "$RUN_ID_LLVM" ]; then
            gh run download "$RUN_ID_LLVM" --name llvm-bins --dir artifacts/llvm-bins || echo "llvm-bins not found"
          fi

      - name: extract downloaded artifacts
        if: ${{ matrix.kind == 'rustc' }}
        run: |
          for f in artifacts/*/*.tar; do
            if [ -f "$f" ]; then
              dir=$(dirname "$f")
              tar -xf "$f" -C "$dir"
              rm "$f"
            fi
          done

      - name: create release assets
        working-directory: "${{ github.workspace }}/rust_wasm"
        env:
          GZIP: -9
        run: |
          mkdir -p "${{ github.workspace }}/x-tools"

          if [ "${{ matrix.kind }}" = "target" ]; then
            release_dir="${{ github.workspace }}/artifacts/${{ matrix.artifact }}"
            if [ ! -d "$release_dir" ]; then
              echo "${{ matrix.artifact }} artifact is missing"
              exit 1
            fi

            raw_manifest="${RUNNER_TEMP}/${{ matrix.task }}-raw.tsv"
            manifest="${RUNNER_TEMP}/${{ matrix.task }}.tsv"
            find "$release_dir" -maxdepth 1 -type f -name '*.tar.gz' \
              -printf '%s\t%f\n' > "$raw_manifest"
            if [ "${{ matrix.platform }}" = "linux" ]; then
              awk -F '\t' '{ name = $2 } name != "rust-src.tar.gz" && name != "rustc-src.tar.gz"' \
                "$raw_manifest" > "${raw_manifest}.targets"
              mv "${raw_manifest}.targets" "$raw_manifest"
            fi
            LC_ALL=C sort -t $'\t' -k1,1nr -k2,2 "$raw_manifest" > "$manifest"

            candidate_count=$(wc -l < "$manifest")
            shard=${{ matrix.shard }}
            shard_count=${{ matrix.shard_count }}
            if [ "$candidate_count" -lt "$shard_count" ]; then
              echo "${{ matrix.artifact }} has fewer targets than shards"
              exit 1
            fi

            index=0
            assigned=0
            while IFS=$'\t' read -r size name; do
              if [ $((index % shard_count)) -eq "$shard" ]; then
                archive="$release_dir/$name"
                cp "$archive" "${{ github.workspace }}/x-tools/$name"
                gzip -dc "$archive" | brotli -q 11 > \
                  "${{ github.workspace }}/x-tools/${name%.tar.gz}.tar.br"
                assigned=$((assigned + 1))
                echo "${name%.tar.gz} done"
              fi
              index=$((index + 1))
            done < "$manifest"
            if [ "$assigned" -eq 0 ]; then
              echo "${{ matrix.task }} received no target archives"
              exit 1
            fi
          fi

          if [ "${{ matrix.kind }}" = "source" ]; then
            release_dir="${{ github.workspace }}/artifacts/release-linux"
            archive="$release_dir/rust-src.tar.gz"
            if [ ! -f "$archive" ]; then
              echo "release-linux artifact is missing rust-src.tar.gz"
              exit 1
            fi
            cp "$archive" "${{ github.workspace }}/x-tools/rust-src.tar.gz"
            gzip -dc "$archive" | brotli -q 11 > \
              "${{ github.workspace }}/x-tools/rust-src.tar.br"

            archive="$release_dir/rustc-src.tar.gz"
            if [ -f "$archive" ]; then
              cp "$archive" "${{ github.workspace }}/x-tools/rustc-src.tar.gz"
              gzip -dc "$archive" | brotli -q 11 > \
                "${{ github.workspace }}/x-tools/rustc-src.tar.br"
            fi
            echo "rust sources done"
          fi

          if [ "${{ matrix.kind }}" = "rustc" ]; then
            if [ -d "${{ github.workspace }}/artifacts/rustc-bins" ]; then
              cd "${{ github.workspace }}/artifacts/rustc-bins"
              cp rustc_opt.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_opt.wasm.tar.gz"
              mkdir unpack
              cd unpack
              tar -xzf ../rustc_opt.wasm.tar.gz
              brotli -q 11 -o "${{ github.workspace }}/x-tools/rustc_opt.wasm.br" rustc_opt.wasm
              cd ..
              rm -rf unpack

              cp rustc_unwind.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_unwind.wasm.tar.gz" || true
              cp rustc_unwind_opt.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_unwind_opt.wasm.tar.gz" || true

              if [ -f "rustc_unwind_opt.wasm.tar.gz" ]; then
                mkdir unpack-unwind
                cd unpack-unwind
                tar -xzf ../rustc_unwind_opt.wasm.tar.gz
                brotli -q 11 -o "${{ github.workspace }}/x-tools/rustc_unwind_opt.wasm.br" rustc_unwind_opt.wasm
                cd ..
                rm -rf unpack-unwind
              fi

              echo "rustc bins done"
            fi
          fi

          if [ "${{ matrix.kind }}" = "llvm" ]; then
            if [ -d "${{ github.workspace }}/artifacts/llvm-bins" ]; then
              cd "${{ github.workspace }}/artifacts/llvm-bins"
              cp dist/llvm_raw.wasm.tar.gz "${{ github.workspace }}/x-tools/llvm_raw.wasm.tar.gz"
              cp llvm_opt.wasm.br "${{ github.workspace }}/x-tools/llvm_opt.wasm.br"
              echo "llvm bins done"
            fi
          fi

      - name: upload partial assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.task }}
          path: x-tools/
          if-no-files-found: error
          compression-level: 0

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: download assets
        uses: actions/download-artifact@v4
        with:
          path: x-tools
          pattern: release-assets-*
          merge-multiple: true

      - name: upload release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            x-tools/*.tar.gz, x-tools/*.br
          tag: "${{ github.event.inputs.version }}-release"
          allowUpdates: true
          prerelease: true

      - name: Finalize
        run: |
          ls -l x-tools/
          echo "Release created successfully"
