name: create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version of the toolchain to build'
        required: true
        default: 'v0.2.1'
      build_run_id:
        description: 'successful rustc_llvm_with_lld run containing the complete artifact set'
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [linux, windows, macos, rustc-bins, llvm-bins]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rust_wasm

      - name: free space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: install brotli
        run: |
          sudo apt-get update
          sudo apt-get install brotli
          echo "brotli installed time: $(date)"

      - name: download artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          
          if [ "${{ matrix.task }}" = "llvm-bins" ]; then
            # Get latest successful run for build_llvm.yml
            RUN_ID_LLVM=$(gh run list --workflow build_llvm.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$RUN_ID_LLVM" != "null" ] && [ -n "$RUN_ID_LLVM" ]; then
              gh run download "$RUN_ID_LLVM" --name llvm-bins --dir artifacts/llvm-bins || echo "llvm-bins not found"
            fi
          else
            # Determine the artifact name to download based on the matrix task
            ARTIFACT_NAME=""
            if [ "${{ matrix.task }}" = "linux" ]; then ARTIFACT_NAME="dist-linux"; fi
            if [ "${{ matrix.task }}" = "windows" ]; then ARTIFACT_NAME="dist-windows"; fi
            if [ "${{ matrix.task }}" = "macos" ]; then ARTIFACT_NAME="dist-macos"; fi
            if [ "${{ matrix.task }}" = "rustc-bins" ]; then ARTIFACT_NAME="rustc-bins"; fi
            
            gh run download "${{ github.event.inputs.build_run_id }}" \
              --name "$ARTIFACT_NAME" \
              --dir "artifacts/${ARTIFACT_NAME}"
          fi
          
          # Extract tar artifacts
          for f in artifacts/*/*.tar; do
            if [ -f "$f" ]; then
              dir=$(dirname "$f")
              tar -xf "$f" -C "$dir"
              rm "$f"
            fi
          done
          
          ls -R artifacts

      - name: create release assets
        working-directory: "${{ github.workspace }}/rust_wasm"
        env:
          GZIP: -9
        run: |
          mkdir -p "${{ github.workspace }}/x-tools"
          
          if [ "${{ matrix.task }}" = "linux" ]; then
            if [ -d "${{ github.workspace }}/artifacts/dist-linux" ]; then
              cd "${{ github.workspace }}/artifacts/dist-linux/dist/lib/rustlib"
              
              # Package rust-src with the layout consumed by Rubrc.
              if [ ! -d "src/rust/library" ]; then
                echo "dist-linux artifact is missing src/rust/library"
                exit 1
              fi
              tar -czf "${{ github.workspace }}/x-tools/rust-src.tar.gz" \
                --directory src/rust/library .
              tar -I "brotli -q 11" \
                -cf "${{ github.workspace }}/x-tools/rust-src.tar.br" \
                --directory src/rust/library .
              echo "rust-src done"

              # Package rustc-src
              if [ -d "rustc-src" ]; then
                tar --ignore-failed-read -czf "${{ github.workspace }}/x-tools/rustc-src.tar.gz" rustc-src
                tar --ignore-failed-read -I "brotli -q 11" -cf "${{ github.workspace }}/x-tools/rustc-src.tar.br" rustc-src
                echo "rustc-src done"
              fi

              # Package target-specific libs
              export WORKSPACE="${{ github.workspace }}"
              for target in *; do
                if [ -d "$target" ] && [ "$target" != "src" ] && [ "$target" != "rustc-src" ]; then
                  echo "$target"
                fi
              done | xargs -I {} -P 4 bash -c '
                target="{}"
                cd "${target}/lib" || exit 1
                tar --ignore-failed-read -chzf "${WORKSPACE}/x-tools/${target}.tar.gz" *
                tar --ignore-failed-read -h -I "brotli -q 11" -cf "${WORKSPACE}/x-tools/${target}.tar.br" *
                echo "${target} done"
              '
            fi
          fi

          if [ "${{ matrix.task }}" = "windows" ]; then
            if [ -d "${{ github.workspace }}/artifacts/dist-windows" ]; then
              cd "${{ github.workspace }}/artifacts/dist-windows/dist/lib/rustlib"
              export WORKSPACE="${{ github.workspace }}"
              for target in *; do
                if [ -d "$target" ] && [ "$target" != "src" ] && [ "$target" != "rustc-src" ]; then
                  echo "$target"
                fi
              done | xargs -I {} -P 4 bash -c '
                target="{}"
                cd "${target}/lib" || exit 1
                tar --ignore-failed-read -chzf "${WORKSPACE}/x-tools/${target}.tar.gz" *
                tar --ignore-failed-read -h -I "brotli -q 11" -cf "${WORKSPACE}/x-tools/${target}.tar.br" *
                echo "${target} done"
              '
            fi
          fi

          if [ "${{ matrix.task }}" = "macos" ]; then
            if [ -d "${{ github.workspace }}/artifacts/dist-macos" ]; then
              cd "${{ github.workspace }}/artifacts/dist-macos/dist/lib/rustlib"
              export WORKSPACE="${{ github.workspace }}"
              for target in *; do
                if [ -d "$target" ] && [ "$target" != "src" ] && [ "$target" != "rustc-src" ]; then
                  echo "$target"
                fi
              done | xargs -I {} -P 4 bash -c '
                target="{}"
                cd "${target}/lib" || exit 1
                tar --ignore-failed-read -chzf "${WORKSPACE}/x-tools/${target}.tar.gz" *
                tar --ignore-failed-read -h -I "brotli -q 11" -cf "${WORKSPACE}/x-tools/${target}.tar.br" *
                echo "${target} done"
              '
            fi
          fi

          if [ "${{ matrix.task }}" = "rustc-bins" ]; then
            if [ -d "${{ github.workspace }}/artifacts/rustc-bins" ]; then
              cd "${{ github.workspace }}/artifacts/rustc-bins"
              cp rustc_opt.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_opt.wasm.tar.gz"
              mkdir unpack
              cd unpack
              tar -xzf ../rustc_opt.wasm.tar.gz
              brotli -q 11 -o "${{ github.workspace }}/x-tools/rustc_opt.wasm.br" rustc_opt.wasm
              cd ..
              rm -rf unpack

              cp rustc_unwind.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_unwind.wasm.tar.gz" || true
              cp rustc_unwind_opt.wasm.tar.gz "${{ github.workspace }}/x-tools/rustc_unwind_opt.wasm.tar.gz" || true
              
              if [ -f "rustc_unwind_opt.wasm.tar.gz" ]; then
                mkdir unpack-unwind
                cd unpack-unwind
                tar -xzf ../rustc_unwind_opt.wasm.tar.gz
                brotli -q 11 -o "${{ github.workspace }}/x-tools/rustc_unwind_opt.wasm.br" rustc_unwind_opt.wasm
                cd ..
                rm -rf unpack-unwind
              fi

              echo "rustc bins done"
            fi
          fi

          if [ "${{ matrix.task }}" = "llvm-bins" ]; then
            if [ -d "${{ github.workspace }}/artifacts/llvm-bins" ]; then
              cd "${{ github.workspace }}/artifacts/llvm-bins"
              cp dist/llvm_raw.wasm.tar.gz "${{ github.workspace }}/x-tools/llvm_raw.wasm.tar.gz"
              cp llvm_opt.wasm.br "${{ github.workspace }}/x-tools/llvm_opt.wasm.br"
              echo "llvm bins done"
            fi
          fi

      - name: upload partial assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.task }}
          path: x-tools/
          if-no-files-found: ignore

  publish:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: download assets
        uses: actions/download-artifact@v4
        with:
          path: x-tools
          pattern: release-assets-*
          merge-multiple: true

      - name: upload release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            x-tools/*.tar.gz, x-tools/*.br
          tag: "${{ github.event.inputs.version }}-release"
          allowUpdates: true
          prerelease: true

      - name: Finalize
        run: |
          ls -l x-tools/
          echo "Release created successfully"
